<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Churn Predictor</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 1.4rem; }
  form { display: grid; gap: 12px; }
  label { font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 4px; }
  select, input { width: 100%; padding: 8px; box-sizing: border-box; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button { margin-top: 16px; padding: 10px; background: #111; color: white; border: none; cursor: pointer; }
  #result { margin-top: 20px; padding: 16px; border-radius: 6px; display: none; }
  #result.yes { background: #fde8e8; border: 1px solid #f5b5b5; }
  #result.no { background: #e7f7ec; border: 1px solid #a7e3b8; }
</style>
</head>
<body>
<h1>Customer Churn Predictor</h1>
<p>Enter customer details to predict churn likelihood.</p>

<form id="churnForm">
  <div class="row">
    <div><label>Gender</label>
      <select name="gender"><option>Female</option><option>Male</option></select>
    </div>
    <div><label>Senior Citizen</label>
      <select name="SeniorCitizen"><option value="0">No</option><option value="1">Yes</option></select>
    </div>
  </div>
  <div class="row">
    <div><label>Partner</label>
      <select name="Partner"><option>No</option><option>Yes</option></select>
    </div>
    <div><label>Dependents</label>
      <select name="Dependents"><option>No</option><option>Yes</option></select>
    </div>
  </div>
  <div><label>Tenure (months)</label><input type="number" name="tenure" value="12" required /></div>
  <div class="row">
    <div><label>Phone Service</label>
      <select name="PhoneService"><option>Yes</option><option>No</option></select>
    </div>
    <div><label>Multiple Lines</label>
      <select name="MultipleLines"><option>No</option><option>Yes</option><option>No phone service</option></select>
    </div>
  </div>
  <div><label>Internet Service</label>
    <select name="InternetService"><option>Fiber optic</option><option>DSL</option><option>No</option></select>
  </div>
  <div class="row">
    <div><label>Online Security</label>
      <select name="OnlineSecurity"><option>No</option><option>Yes</option><option>No internet service</option></select>
    </div>
    <div><label>Online Backup</label>
      <select name="OnlineBackup"><option>No</option><option>Yes</option><option>No internet service</option></select>
    </div>
  </div>
  <div class="row">
    <div><label>Device Protection</label>
      <select name="DeviceProtection"><option>No</option><option>Yes</option><option>No internet service</option></select>
    </div>
    <div><label>Tech Support</label>
      <select name="TechSupport"><option>No</option><option>Yes</option><option>No internet service</option></select>
    </div>
  </div>
  <div class="row">
    <div><label>Streaming TV</label>
      <select name="StreamingTV"><option>No</option><option>Yes</option><option>No internet service</option></select>
    </div>
    <div><label>Streaming Movies</label>
      <select name="StreamingMovies"><option>No</option><option>Yes</option><option>No internet service</option></select>
    </div>
  </div>
  <div><label>Contract</label>
    <select name="Contract"><option>Month-to-month</option><option>One year</option><option>Two year</option></select>
  </div>
  <div class="row">
    <div><label>Paperless Billing</label>
      <select name="PaperlessBilling"><option>Yes</option><option>No</option></select>
    </div>
    <div><label>Payment Method</label>
      <select name="PaymentMethod">
        <option>Electronic check</option>
        <option>Mailed check</option>
        <option>Bank transfer (automatic)</option>
        <option>Credit card (automatic)</option>
      </select>
    </div>
  </div>
  <div class="row">
    <div><label>Monthly Charges</label><input type="number" step="0.01" name="MonthlyCharges" value="70.35" required /></div>
    <div><label>Total Charges</label><input type="number" step="0.01" name="TotalCharges" value="845.50" required /></div>
  </div>
  <button type="submit">Predict Churn</button>
</form>

<div id="result"></div>

<script>
const form = document.getElementById('churnForm');
const resultDiv = document.getElementById('result');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = new FormData(form);
  const payload = Object.fromEntries(formData.entries());
  payload.SeniorCitizen = parseInt(payload.SeniorCitizen);
  payload.tenure = parseInt(payload.tenure);
  payload.MonthlyCharges = parseFloat(payload.MonthlyCharges);
  payload.TotalCharges = parseFloat(payload.TotalCharges);

  resultDiv.style.display = 'block';
  resultDiv.className = '';
  resultDiv.textContent = 'Predicting...';

  try {
    const res = await fetch('/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error((await res.json()).detail || 'Request failed');
    const data = await res.json();
    resultDiv.className = data.churn_prediction === 'Yes' ? 'yes' : 'no';
    resultDiv.innerHTML = `<strong>Prediction: ${data.churn_prediction}</strong><br/>Churn probability: ${(data.churn_probability * 100).toFixed(1)}%`;
  } catch (err) {
    resultDiv.className = 'yes';
    resultDiv.textContent = 'Error: ' + err.message;
  }
});
</script>
</body>
</html>
