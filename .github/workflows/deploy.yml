name: Build and Deploy Churn App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: churn-app-repo
  ECS_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

jobs:
  terraform-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform fmt check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

  tfsec-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          additional_args: --minimum-severity CRITICAL

  trivy-image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image for scanning
        run: docker build -t churn-app:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: churn-app:scan
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: [terraform-checks, tfsec-scan, trivy-image-scan]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Ensure EC2 instance is ready for SSM
        run: |
          INSTANCE_STATE=$(aws ec2 describe-instances \
            --instance-ids "${{ env.ECS_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)

          echo "Current EC2 instance state: $INSTANCE_STATE"

          case "$INSTANCE_STATE" in
            running)
              ;;
            stopped)
              echo "Starting EC2 instance ${ECS_INSTANCE_ID}..."
              aws ec2 start-instances \
                --instance-ids "${{ env.ECS_INSTANCE_ID }}" \
                --region "${{ env.AWS_REGION }}" >/dev/null
              aws ec2 wait instance-running \
                --instance-ids "${{ env.ECS_INSTANCE_ID }}" \
                --region "${{ env.AWS_REGION }}"
              ;;
            pending|stopping)
              echo "Waiting for EC2 instance ${ECS_INSTANCE_ID} to become running..."
              aws ec2 wait instance-running \
                --instance-ids "${{ env.ECS_INSTANCE_ID }}" \
                --region "${{ env.AWS_REGION }}"
              ;;
            *)
              echo "EC2 instance ${ECS_INSTANCE_ID} is in unsupported state: $INSTANCE_STATE" >&2
              exit 1
              ;;
          esac

          echo "Waiting for SSM PingStatus=Online..."
          for i in $(seq 1 30); do
            PING_STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ env.ECS_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || echo "Offline")

            if [ "$PING_STATUS" = "Online" ]; then
              echo "SSM agent is online."
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "SSM agent did not become online after 300 seconds (last status: $PING_STATUS)." >&2
              exit 1
            fi

            echo "Attempt $i: SSM status=$PING_STATUS. Retrying in 10s..."
            sleep 10
          done

      - name: Deploy new image to EC2 via SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          cat > /tmp/deploy-commands.json << 'EOFC'
          {
            "commands": [
              "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "docker pull ${ECR_REGISTRY}/churn-app-repo:latest",
              "docker stop churn-app || true",
              "docker rm churn-app || true",
              "docker run -d --restart unless-stopped -p 8000:8000 --name churn-app ${ECR_REGISTRY}/churn-app-repo:latest",
              "READY=0; for i in $(seq 1 30); do if curl -fsS -m 2 http://localhost:8000/ready > /dev/null; then READY=1; break; fi; sleep 2; done",
              "if [ $READY -ne 1 ]; then echo 'Health check failed: /ready did not return 200 within 60s' >&2; docker logs --tail 50 churn-app 1>&2; exit 1; fi",
              "docker system df",
              "docker image prune -af"
            ]
          }
          EOFC

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.ECS_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy latest churn-app image" \
            --parameters file:///tmp/deploy-commands.json \
            --region "${{ env.AWS_REGION }}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM CommandId: $COMMAND_ID"

          STATUS="Pending"
          for i in $(seq 1 40); do
            sleep 5

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.ECS_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $i: status=$STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment succeeded."
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deployment failed with status: $STATUS"
              echo "----- StandardErrorContent -----"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ env.ECS_INSTANCE_ID }}" \
                --region "${{ env.AWS_REGION }}" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
          done

          echo "Timed out waiting for deployment to reach a final status (last status: $STATUS)."
          exit 1
